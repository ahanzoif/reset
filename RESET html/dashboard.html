<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESET Dashboard</title>
</head>
<body>
    
<div class="app">

<!-- Sidebar -->

<aside class="sidebar">
    <div class="logo">
        RESET
    </div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="goals.html">Goals</a>
        <a href="check-in.html">Check-in</a>
        <a href="calender.html">Calender</a>
        <a href="statistics.html">Statistics</a>
        <a href="insights.html">Insights</a>
        <a href="milestones.html">Milestones</a>
        <a href="settings.html">Settings</a>
    </nav>

</aside>

<!-- Main -->

<main class="main">

    <header class="dashboard-header">

        <div>
            <h1>Good evening, Kaif !</h1>
            <p>Small progress every day leads to big results.</p>
        </div>
        
        <button id="newGoalBtn">
            + New Goal
        </button>
    </header>

    <!-- Statistics -->
     
    <section class="stats">

        <div class="stats-card">
            <h3>Active Goals</h3>
            <strong id="activegoals">0</strong>
        </div>

        <div class="stats-card">
            <h3>Current Streak</h3>
            <strong id="currentstreak">0</strong>
        </div>

        <div class="stats-card">
            <h3>Success Rate</h3>
            <strong>0%</strong>
        </div>

        <div class="stats-card">
            <h3>Total Check-ins</h3>
            <strong id="totalcheckins">0</strong>
        </div>

        <div class="stats-card">
            <h3>Relapses / Missed</h3>
            <strong id="relapses-missed">0</strong>
        </div>

    </section>

    
</main>

</div>

</body>
</html>
